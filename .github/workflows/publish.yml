name: Pack and publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Pack (local feed for tests)
        run: |
          dotnet pack GitHooksFolderSetter/GitHooksFolderSetter.csproj \
            -o /tmp/ghfs-pkg --nologo -v quiet

      - name: Test
        run: |
          dotnet test tests/GitHooksFolderSetter.Tests/GitHooksFolderSetter.Tests.csproj \
            --nologo
        env:
          GHFS_PKG_DIR: /tmp/ghfs-pkg

  publish:
    name: Publish to NuGet
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for NuGet trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Pack
        run: |
          dotnet pack GitHooksFolderSetter/GitHooksFolderSetter.csproj \
            --nologo -v quiet -o ./nupkg

      - name: Login to NuGet (trusted publisher / OIDC)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ki0

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget_login.outputs.token }} \
            --skip-duplicate
